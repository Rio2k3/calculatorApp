name: Java CI for Calculator App

on:
  push:
    branches:
      - main
      - fix-division-bug
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'   # <- mandatory now

      - name: Build with Maven
        run: mvn clean install

      - name: Run tests
        run: mvn test